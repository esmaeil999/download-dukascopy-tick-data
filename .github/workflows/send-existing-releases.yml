name: Send Existing Releases To Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  send-releases:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Releases to Telegram

        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}

        run: |

          set -euo pipefail

          SENT_FILE=".telegram_sent_releases"

          if [ ! -f "$SENT_FILE" ]; then
            touch "$SENT_FILE"
          fi

          echo "Getting GitHub Releases..."

          RELEASES=$(gh api \
            "repos/$REPO/releases?per_page=100" \
            --paginate)

          TOTAL=$(echo "$RELEASES" | jq 'length')

          echo "Total releases found: $TOTAL"

          echo "$RELEASES" | jq -c 'reverse[]' | while IFS= read -r RELEASE
          do

            TAG=$(echo "$RELEASE" | jq -r '.tag_name')

            echo "----------------------------------------"
            echo "Checking: $TAG"

            if grep -Fxq "$TAG" "$SENT_FILE"; then
              echo "Already sent: $TAG"
              continue
            fi

            TITLE=$(echo "$RELEASE" | jq -r '.name')

            DOWNLOAD_URL=$(echo "$RELEASE" | jq -r '.assets[0].browser_download_url')

            if [ "$DOWNLOAD_URL" = "null" ] || [ -z "$DOWNLOAD_URL" ]; then
              echo "No asset found: $TAG"
              continue
            fi

            SIZE=$(echo "$RELEASE" | jq '[.assets[].size] | add // 0')

            SIZE_MB=$(awk "BEGIN {printf \"%.0f\", $SIZE/1024/1024}")

            FROM=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)

            TO=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1 || true)

            SYMBOL=$(echo "$TITLE" | awk '{print $1}')

            TEXT="📦 <b>${SYMBOL} Tick Data</b>
━━━━━━━━━━━━━━━━
📅 ${FROM} → ${TO}
💾 Size: ${SIZE_MB} MB"

            KEYBOARD=$(jq -n \
              --arg url "$DOWNLOAD_URL" \
              '{
                inline_keyboard: [
                  [
                    {
                      text: "⬇️ DOWNLOAD",
                      url: $url
                    }
                  ]
                ]
              }')

            JSON=$(jq -n \
              --arg chat "$TELEGRAM_CHAT_ID" \
              --arg text "$TEXT" \
              --argjson keyboard "$KEYBOARD" \
              '{
                chat_id: $chat,
                text: $text,
                parse_mode: "HTML",
                disable_web_page_preview: true,
                reply_markup: $keyboard
              }')

            echo "Sending to Telegram: $TAG"

            RESPONSE=$(curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$JSON")

            echo "Telegram response:"
            echo "$RESPONSE" | jq .

            OK=$(echo "$RESPONSE" | jq -r '.ok')

            if [ "$OK" = "true" ]; then

              echo "$TAG" >> "$SENT_FILE"

              echo "Successfully sent: $TAG"

            else

              echo "Telegram send failed: $TAG"

            fi

            sleep 3

          done


      - name: Save sent releases list

        shell: bash

        run: |

          set -euo pipefail

          if git diff --quiet -- .telegram_sent_releases; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .telegram_sent_releases

          git commit -m "Update sent Telegram releases list"

          git push
