name: Send Existing Releases To Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Releases to Telegram
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SENT_FILE=".telegram_sent_releases"

          if [ ! -f "$SENT_FILE" ]; then
            touch "$SENT_FILE"
          fi

          echo "========================================"
          echo "Getting GitHub Releases..."
          echo "========================================"

          gh api \
            "repos/$REPO/releases?per_page=100" \
            --paginate \
            > releases.json

          TOTAL=$(jq 'length' releases.json)

          echo "Total releases found: $TOTAL"
          echo ""

          jq -c 'reverse[]' releases.json > releases_list.txt

          while IFS= read -r RELEASE
          do
            TAG=$(echo "$RELEASE" | jq -r '.tag_name')
            TITLE=$(echo "$RELEASE" | jq -r '.name')
            RELEASE_URL=$(echo "$RELEASE" | jq -r '.html_url')

            echo "----------------------------------------"
            echo "Checking: $TAG"

            if grep -Fxq "$TAG" "$SENT_FILE"; then
              echo "Already sent: $TAG"
              continue
            fi

            ASSET_COUNT=$(echo "$RELEASE" | jq '.assets | length')

            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo "No assets found: $TAG"
              continue
            fi

            echo "Assets found: $ASSET_COUNT"

            SIZE=$(echo "$RELEASE" | jq '[.assets[].size] | add // 0')

            SIZE_MB=$(awk "BEGIN {printf \"%.0f\", $SIZE/1024/1024}")

            FROM=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)

            TO=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1 || true)

            SYMBOL=$(echo "$TITLE" | awk '{print $1}')

            if [ -z "$FROM" ]; then
              FROM="N/A"
            fi

            if [ -z "$TO" ]; then
              TO="N/A"
            fi

            if [ -z "$SYMBOL" ]; then
              SYMBOL="TICK"
            fi

            TEXT="📦 ${SYMBOL} Tick Data
━━━━━━━━━━━━━━━━
📅 ${FROM} → ${TO}
💾 Size: ${SIZE_MB} MB"

            KEYBOARD=$(jq -n \
              --arg url "$RELEASE_URL" \
              '{
                inline_keyboard: [
                  [
                    {
                      text: "⬇️ DOWNLOAD",
                      url: $url
                    }
                  ]
                ]
              }')

            JSON=$(jq -n \
              --arg chat "$TELEGRAM_CHAT_ID" \
              --arg text "$TEXT" \
              --argjson keyboard "$KEYBOARD" \
              '{
                chat_id: $chat,
                text: $text,
                reply_markup: $keyboard,
                disable_web_page_preview: true
              }')

            echo "Sending to Telegram: $TAG"

            RESPONSE=$(curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$JSON")

            echo "Telegram response:"
            echo "$RESPONSE" | jq .

            OK=$(echo "$RESPONSE" | jq -r '.ok // false')

            if [ "$OK" = "true" ]; then

              echo "$TAG" >> "$SENT_FILE"

              echo "Successfully sent: $TAG"

            else

              echo "Telegram send failed: $TAG"

              RETRY_AFTER=$(echo "$RESPONSE" | jq -r '.parameters.retry_after // 0')

              if [ "$RETRY_AFTER" -gt 0 ]; then
                echo "Telegram rate limit. Waiting ${RETRY_AFTER} seconds..."
                sleep "$RETRY_AFTER"
              fi

            fi

            echo "Waiting 3 seconds..."
            sleep 3

          done < releases_list.txt

          echo ""
          echo "========================================"
          echo "Finished sending releases."
          echo "========================================"

      - name: Save sent releases list
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- .telegram_sent_releases; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .telegram_sent_releases

          git commit -m "Update sent Telegram releases list"

          git push
