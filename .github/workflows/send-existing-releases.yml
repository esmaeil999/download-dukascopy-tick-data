name: Send Existing Releases To Telegram

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:

  send-releases:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Send Releases to Telegram

        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}

        run: |

          set -euo pipefail


          SENT_FILE=".telegram_sent_releases"


          if [ ! -f "$SENT_FILE" ]; then
            touch "$SENT_FILE"
          fi


          RELEASES=$(gh api \
          repos/$REPO/releases \
          --paginate \
          -F per_page=100)


          echo "Total releases:"
          echo "$RELEASES" | jq length


          echo "$RELEASES" | jq -c 'reverse[]' | while read RELEASE
          do

            TAG=$(echo "$RELEASE" | jq -r '.tag_name')


            if grep -Fxq "$TAG" "$SENT_FILE"; then
              echo "Already sent: $TAG"
              continue
            fi


            TITLE=$(echo "$RELEASE" | jq -r '.name')


            DOWNLOAD_URL=$(echo "$RELEASE" | jq -r '.assets[0].browser_download_url')


            if [ "$DOWNLOAD_URL" = "null" ]; then
              echo "No asset: $TAG"
              continue
            fi


            SIZE=$(echo "$RELEASE" | jq '[.assets[].size] | add')


            SIZE_MB=$(awk "BEGIN {printf \"%.0f\", $SIZE/1024/1024}")


            FROM=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)

            TO=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1)


            SYMBOL=$(echo "$TITLE" | awk '{print $1}')


            TEXT="📦 <b>${SYMBOL} Tick Data</b>%0A"
            TEXT+="━━━━━━━━━━━━━━━━%0A"
            TEXT+="📅 ${FROM} → ${TO}%0A"
            TEXT+="💾 Size: ${SIZE_MB} MB"


            KEYBOARD=$(jq -n \
            --arg url "$DOWNLOAD_URL" \
            '{
              inline_keyboard:
              [
                [
                  {
                    text:"⬇️ DOWNLOAD",
                    url:$url
                  }
                ]
              ]
            }')


            RESPONSE=$(curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat "$TELEGRAM_CHAT_ID" \
              --arg text "$TEXT" \
              --argjson kb "$KEYBOARD" \
              '{
                chat_id:$chat,
                text:$text,
                parse_mode:"HTML",
                disable_web_page_preview:true,
                reply_markup:$kb
              }'
            )")


            echo "$RESPONSE" | jq


            OK=$(echo "$RESPONSE" | jq -r '.ok')


            if [ "$OK" = "true" ]; then

              echo "$TAG" >> "$SENT_FILE"

              echo "Sent and saved: $TAG"

            else

              echo "Telegram send failed: $TAG"

            fi


            sleep 3


          done



      - name: Save sent releases list

        shell: bash

        run: |

          if git diff --quiet .telegram_sent_releases; then
            echo "No changes"
            exit 0
          fi


          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add .telegram_sent_releases


          git commit -m "Update sent Telegram releases list"


          git push
