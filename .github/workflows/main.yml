# ============================================================
  # 3) Send Releases to Telegram in chronological order
  # ============================================================

  send-to-telegram:
    needs:
      - prepare
      - download-year

    runs-on: ubuntu-latest

    steps:

      - name: Send releases to Telegram in order
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          OVERALL_FROM: ${{ needs.prepare.outputs.from_date }}
          OVERALL_TO: ${{ needs.prepare.outputs.to_date }}

          INSTRUMENT: ${{ needs.prepare.outputs.instrument }}
          INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting ordered Telegram sending"
          echo "=========================================="


          # ----------------------------------------------------
          # Check Telegram secrets
          # ----------------------------------------------------

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing."
            exit 1
          fi


          # ----------------------------------------------------
          # Calculate years
          # ----------------------------------------------------

          FROM_YEAR=$(date -d "$OVERALL_FROM" +%Y)
          TO_YEAR=$(date -d "$OVERALL_TO" +%Y)


          echo "Instrument : $INSTRUMENT_UPPER"
          echo "From       : $OVERALL_FROM"
          echo "To         : $OVERALL_TO"
          echo "Years      : $FROM_YEAR -> $TO_YEAR"


          # ----------------------------------------------------
          # Send years in chronological order
          # ----------------------------------------------------

          for ((YEAR=FROM_YEAR; YEAR<=TO_YEAR; YEAR++)); do

            echo ""
            echo "=========================================="
            echo "Processing year: $YEAR"
            echo "=========================================="


            # --------------------------------------------------
            # Calculate yearly range
            # --------------------------------------------------

            YEAR_START="${YEAR}-01-01"

            YEAR_END=$(date \
              -d "${YEAR}-01-01 +1 year" \
              +%Y-%m-%d)


            # --------------------------------------------------
            # Start date
            # --------------------------------------------------

            if [ "$YEAR" -eq "$FROM_YEAR" ]; then
              FROM_DATE="$OVERALL_FROM"
            else
              FROM_DATE="$YEAR_START"
            fi


            # --------------------------------------------------
            # End date
            # --------------------------------------------------

            if [ "$YEAR" -eq "$TO_YEAR" ]; then
              TO_DATE="$OVERALL_TO"
            else
              TO_DATE="$YEAR_END"
            fi


            # --------------------------------------------------
            # Release tag
            # --------------------------------------------------

            TAG="${INSTRUMENT}-ticks-${FROM_DATE}-to-${TO_DATE}"

            ASSET_NAME="${TAG}.zip"


            echo "From       : $FROM_DATE"
            echo "To         : $TO_DATE"
            echo "Release    : $TAG"
            echo "Asset      : $ASSET_NAME"


            # --------------------------------------------------
            # Check that release exists
            # --------------------------------------------------

            if ! gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

              echo "ERROR: Release does not exist:"
              echo "$TAG"

              exit 1

            fi


            # --------------------------------------------------
            # Get normal ZIP asset URL
            # --------------------------------------------------

            ASSET_URL=$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .url" \
              | head -n 1)


            # --------------------------------------------------
            # Check for split files
            # --------------------------------------------------

            if [ -z "$ASSET_URL" ]; then

              echo "Normal ZIP not found."

              PART_COUNT=$(gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq "[.assets[] | select(.name | startswith(\"$ASSET_NAME.\"))] | length")


              if [ "$PART_COUNT" -eq 0 ]; then

                echo "ERROR: No ZIP or split ZIP files found."

                exit 1

              fi


              echo "Found $PART_COUNT split ZIP parts."


              # ------------------------------------------------
              # Use first part as download link
              # ------------------------------------------------

              FIRST_PART=$(gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq ".assets[] | select(.name | startswith(\"$ASSET_NAME.\")) | .url" \
                | head -n 1)


              ASSET_URL="$FIRST_PART"

              DOWNLOAD_TEXT="⬇️ DOWNLOAD PARTS"

            else

              DOWNLOAD_TEXT="⬇️ DOWNLOAD"

            fi


            # --------------------------------------------------
            # Get file size
            # --------------------------------------------------

            ASSET_SIZE=$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .size" \
              | head -n 1)


            if [ -z "$ASSET_SIZE" ]; then
              ASSET_SIZE=0
            fi


            FILE_SIZE_MB=$(awk \
              "BEGIN {printf \"%.2f\", $ASSET_SIZE / 1024 / 1024}")


            # --------------------------------------------------
            # Create Telegram message
            # --------------------------------------------------

            CAPTION=$(printf \
              '<b>📦 %s Tick Data</b>\n━━━━━━━━━━━━━━━━\n📅 %s → %s\n💾 Size: %s MB' \
              "$INSTRUMENT_UPPER" \
              "$FROM_DATE" \
              "$TO_DATE" \
              "$FILE_SIZE_MB")


            # --------------------------------------------------
            # Create Telegram keyboard
            # --------------------------------------------------

            KEYBOARD=$(printf \
              '{"inline_keyboard":[[{"text":"%s","url":"%s"}]]}' \
              "$DOWNLOAD_TEXT" \
              "$ASSET_URL")


            # --------------------------------------------------
            # Send Telegram message
            # --------------------------------------------------

            echo ""
            echo "Sending $YEAR to Telegram..."


            RESPONSE=$(curl -fsS \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${CAPTION}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "reply_markup=${KEYBOARD}")


            echo "$RESPONSE"


            # --------------------------------------------------
            # Check Telegram response
            # --------------------------------------------------

            if ! echo "$RESPONSE" | grep -q '"ok":true'; then

              echo "ERROR: Telegram failed for year $YEAR."

              exit 1

            fi


            echo "✅ Year $YEAR sent successfully."


            # --------------------------------------------------
            # Wait before next year
            # --------------------------------------------------

            sleep 2

          done


          echo ""
          echo "=========================================="
          echo "✅ ALL YEARS SENT TO TELEGRAM"
          echo "=========================================="
