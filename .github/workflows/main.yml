# ============================================================
  # 3) Send Releases to Telegram in chronological order
  # ============================================================

  send-to-telegram:
    needs:
      - prepare
      - download-year

    runs-on: ubuntu-latest

    steps:

      - name: Send releases to Telegram in order
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          OVERALL_FROM: ${{ needs.prepare.outputs.from_date }}
          OVERALL_TO: ${{ needs.prepare.outputs.to_date }}

          INSTRUMENT: ${{ needs.prepare.outputs.instrument }}
          INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}

        run: |
          set -euo pipefail

          # ====================================================
          # Check Telegram secrets
          # ====================================================

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing."
            exit 1
          fi


          # ====================================================
          # Calculate first and last year
          # ====================================================

          FROM_YEAR=$(date -d "$OVERALL_FROM" +%Y)
          TO_YEAR=$(date -d "$OVERALL_TO" +%Y)


          echo "=============================================="
          echo "Telegram ordered sending"
          echo "Instrument : $INSTRUMENT_UPPER"
          echo "From       : $OVERALL_FROM"
          echo "To         : $OVERALL_TO"
          echo "Years      : $FROM_YEAR -> $TO_YEAR"
          echo "=============================================="


          # ====================================================
          # Send years one by one
          # ====================================================

          for ((YEAR=FROM_YEAR; YEAR<=TO_YEAR; YEAR++)); do

            echo ""
            echo "=============================================="
            echo "Preparing year: $YEAR"
            echo "=============================================="


            # --------------------------------------------------
            # Calculate yearly dates
            # --------------------------------------------------

            YEAR_START="${YEAR}-01-01"

            YEAR_END=$(date \
              -d "${YEAR}-01-01 +1 year" \
              +%Y-%m-%d)


            # --------------------------------------------------
            # Start date
            # --------------------------------------------------

            if [ "$YEAR" -eq "$FROM_YEAR" ]; then
              FROM_DATE="$OVERALL_FROM"
            else
              FROM_DATE="$YEAR_START"
            fi


            # --------------------------------------------------
            # End date
            # --------------------------------------------------

            if [ "$YEAR" -eq "$TO_YEAR" ]; then
              TO_DATE="$OVERALL_TO"
            else
              TO_DATE="$YEAR_END"
            fi


            # --------------------------------------------------
            # Release tag
            # --------------------------------------------------

            TAG="${INSTRUMENT}-ticks-${FROM_DATE}-to-${TO_DATE}"


            echo "Year       : $YEAR"
            echo "From       : $FROM_DATE"
            echo "To         : $TO_DATE"
            echo "Release tag: $TAG"


            # ==================================================
            # Get release information
            # ==================================================

            RELEASE_JSON=$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets)


            if [ -z "$RELEASE_JSON" ]; then
              echo "ERROR: Release not found: $TAG"
              exit 1
            fi


            # ==================================================
            # Find ZIP asset
            # ==================================================

            ASSET_NAME="${TAG}.zip"


            ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)

target = sys.argv[1]

for asset in data.get("assets", []):
    if asset.get("name") == target:
        print(asset.get("url", ""))
        break
' "$ASSET_NAME")


            # ==================================================
            # Find split ZIP parts if original ZIP does not exist
            # ==================================================

            if [ -z "$ASSET_URL" ]; then

              echo "Original ZIP not found."

              echo "Checking split ZIP parts..."


              PARTS=$(echo "$RELEASE_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)

target = sys.argv[1]

for asset in data.get("assets", []):
    name = asset.get("name", "")
    if name.startswith(target + "."):
        print(name)
' "$ASSET_NAME")


              if [ -z "$PARTS" ]; then
                echo "ERROR: No ZIP asset found for:"
                echo "$TAG"
                exit 1
              fi


              echo "Split files found:"
              echo "$PARTS"


              # ------------------------------------------------
              # Use first split part as download URL
              # ------------------------------------------------

              FIRST_PART=$(echo "$PARTS" | head -n 1)


              ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)

target = sys.argv[1]

for asset in data.get("assets", []):
    if asset.get("name") == target:
        print(asset.get("url", ""))
        break
' "$FIRST_PART")


              DOWNLOAD_TEXT="⬇️ DOWNLOAD PARTS"

            else

              DOWNLOAD_TEXT="⬇️ DOWNLOAD"

            fi


            # ==================================================
            # Get file size
            # ==================================================

            ASSET_SIZE=$(echo "$RELEASE_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)

target = sys.argv[1]

for asset in data.get("assets", []):
    if asset.get("name") == target:
        print(asset.get("size", 0))
        break
' "$ASSET_NAME")


            if [ -z "$ASSET_SIZE" ]; then
              ASSET_SIZE=0
            fi


            FILE_SIZE_MB=$(awk \
              "BEGIN {printf \"%.2f\", $ASSET_SIZE / 1024 / 1024}"


            # ==================================================
            # Telegram caption
            # ==================================================

            CAPTION=$(printf \
              '<b>📦 %s Tick Data</b>\n━━━━━━━━━━━━━━━━\n📅 %s → %s\n💾 Size: %s MB' \
              "$INSTRUMENT_UPPER" \
              "$FROM_DATE" \
              "$TO_DATE" \
              "$FILE_SIZE_MB")


            # ==================================================
            # Telegram inline keyboard
            # ==================================================

            KEYBOARD=$(python3 -c '
import json
import os

keyboard = {
    "inline_keyboard": [
        [
            {
                "text": os.environ["DOWNLOAD_TEXT"],
                "url": os.environ["ASSET_URL"]
            }
        ]
    ]
}

print(json.dumps(keyboard, ensure_ascii=False))
' \
              DOWNLOAD_TEXT="$DOWNLOAD_TEXT" \
              ASSET_URL="$ASSET_URL")


            # ==================================================
            # Send Telegram message
            # ==================================================

            echo ""
            echo "Sending year $YEAR to Telegram..."


            RESPONSE=$(curl -fsS \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${CAPTION}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "reply_markup=${KEYBOARD}")


            echo "$RESPONSE"


            # ==================================================
            # Check Telegram result
            # ==================================================

            if ! echo "$RESPONSE" | grep -q '"ok":true'; then

              echo "ERROR: Telegram failed for year $YEAR."

              exit 1

            fi


            echo "✅ Year $YEAR sent successfully."


            # ==================================================
            # Wait before next message
            # ==================================================

            sleep 2

          done


          echo ""
          echo "=============================================="
          echo "✅ ALL YEARS SENT TO TELEGRAM"
          echo "=============================================="
